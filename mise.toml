[tools]
python = "3.12"
uv = "latest"
node = "22"   # reserved for the upcoming web/ front end

[env]
_.file = ".env"
_.python.venv = { path = ".venv", create = true }

# ---------------------------------------------------------------------------
# Tasks: `mise run <task>` (or `mise <task>` when unambiguous)
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install Python deps, create .env, start the DB, apply schema"
run = [
  "test -f .env || cp .env.example .env",
  "uv sync",
  "mise run db:up",
  "uv run tempus db init",
]

[tasks."db:up"]
description = "Start TimescaleDB (Tiger) in Docker and wait until healthy"
run = "docker compose up -d --wait db"

[tasks."db:down"]
description = "Stop the database container (data is kept)"
run = "docker compose down"

[tasks."db:reset"]
description = "Destroy the database volume and re-create the schema"
run = [
  "docker compose down -v",
  "mise run db:up",
  "uv run tempus db init",
]

[tasks."db:psql"]
description = "Open a psql shell inside the container"
run = "docker compose exec db psql -U postgres -d ${TEMPUS_DB_NAME:-tempus}"

[tasks."db:logs"]
description = "Tail database logs"
run = "docker compose logs -f db"

[tasks.sync]
description = "Sync every series in catalog.toml into the database"
run = "uv run tempus sync"

[tasks."stack:review-due"]
description = "Report how long since the last stack review (docs/STACK.md)"
run = '''
python3 - <<'PY'
import datetime, re, sys
text = open("docs/STACK.md").read()
m = re.search(r"\*\*Last reviewed:\*\* (\d{4}-\d{2}-\d{2})", text)
if not m:
    sys.exit("No 'Last reviewed' date found in docs/STACK.md")
days = (datetime.date.today() - datetime.date.fromisoformat(m.group(1))).days
if days > 90:
    print(f"Stack review OVERDUE: last reviewed {m.group(1)} ({days} days ago). See docs/STACK.md -> Review.")
    sys.exit(1)
print(f"Stack review current: last reviewed {m.group(1)} ({days} days ago); due in {90 - days} days.")
PY
'''

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Lint and format-check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.fmt]
description = "Auto-format and fix lint"
run = ["uv run ruff format .", "uv run ruff check --fix ."]
