# DRAFT placements of the FRED snapshot (data/fred/series-snapshot.json) in the concept
# tree, written by a Claude session on 2026-10-04 and approved by the user as a temporary
# exception to "Jev decides" (see docs/ARCHITECTURE.md -> Decisions). They give the explore
# view a populated tree before any Jev filing has run.
#
# `tempus ontology load` records these with method 'draft'. Manual pins (catalog.toml) and
# Jev placements ('auto') always win, and `tempus ontology file` re-decides drafts, so real
# filing replaces them series by series. Entries marked `low: ...` were judgment calls.
#
# Format (version 1): concept id -> list of series refs (`source:series_id`), or
# {ref, low} for a low-confidence call. Concepts follow tree order; series are sorted by
# FRED popularity, most popular first.
