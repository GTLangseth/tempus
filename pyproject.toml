[project]
name = "tempus"
version = "0.1.0"
description = "Collect public time-series data (FRED, …) into TimescaleDB and explore it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "polars>=1.30",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0.3",
  "rich>=13.7",
  "tomlkit>=0.13",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
  "watchfiles>=0.24",
]

[project.scripts]
tempus = "tempus.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Specs and plans are dated records; ruff would reformat the Python blocks inside them.
exclude = ["docs/specs/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option/Argument defaults are the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
