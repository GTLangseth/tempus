<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var s = localStorage.getItem("tempus.theme");
      if (s === "light" || s === "dark") {
        document.querySelector('meta[name="color-scheme"]').content = s;
      }
    } catch {}
  </script>
  <title>tempus</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%231c1b19%27/%3E%3Ccircle cx=%2711%27 cy=%275%27 r=%272.5%27 fill=%27%23ff1f8f%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <!-- three.js, pinned (docs/STACK.md). Loaded only by the 3D explore view. -->
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <header>
    <a class="brand" href="#/explore">tempus</a>
    <nav>
      <a href="#/explore" data-view="explore">Explore</a>
      <a href="#/cards" data-view="cards">Cards</a>
      <a href="#/readings" data-view="readings">Readings</a>
    </nav>
    <button type="button" id="theme-toggle" class="btn ghost theme-toggle">
      <span class="theme-opt theme-opt-dark">
        <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span class="sr-only">Switch to Catppuccin </span>Macchiato<span class="sr-only"> dark theme</span>
      </span>
      <span class="theme-opt theme-opt-light">
        <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <span class="sr-only">Switch to </span>Paper<span class="sr-only"> light theme</span>
      </span>
    </button>
  </header>
  <div id="view"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
