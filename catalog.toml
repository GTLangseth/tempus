# --- Consumer prices: where commodities land ---------------------------------

[[series]]
source = "fred"
id = "CPILFESL"       # Core CPI (less food & energy)

[[series]]
source = "fred"
id = "CPIENGSL"       # CPI: Energy

[[series]]
source = "fred"
id = "CUSR0000SETB01" # CPI: Gasoline (all types)

[[series]]
source = "fred"
id = "GASREGW"        # US Regular Gasoline Retail Price (weekly, $/gal)

[[series]]
source = "fred"
id = "CPIUFDSL"       # CPI: Food

[[series]]
source = "fred"
id = "CUSR0000SAF11"  # CPI: Food at Home

[[series]]
source = "fred"
id = "CUSR0000SEFP01" # CPI: Coffee

[[series]]
source = "fred"
id = "APU0000717311"  # Average Retail Price: Ground Coffee ($/lb)

# --- Commodities: precious metals ----------------------------------------------

[[series]]
source = "fred"
id = "NASDAQQGLDI"  # Credit Suisse NASDAQ Gold FLOWS103: tracks the gold price, not miners
concept = "prices.commodities.metals"  # Jev filed it under equity indexes by its name
