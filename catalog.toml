# Series that `tempus sync` keeps up to date.
# Add with `tempus catalog add fred <SERIES_ID>` or edit by hand.
# Optional `concept = "<dotted.id>"` pins a series in the ontology, overriding auto filing.

# --- Headline indicators -----------------------------------------------------

[[series]]
source = "fred"
id = "UNRATE"   # Unemployment Rate

[[series]]
source = "fred"
id = "CPIAUCSL" # CPI, All Urban Consumers

[[series]]
source = "fred"
id = "GDP"      # Gross Domestic Product

[[series]]
source = "fred"
id = "DGS10"    # 10-Year Treasury Constant Maturity Rate

# --- Commodities: energy -----------------------------------------------------

[[series]]
source = "fred"
id = "DCOILWTICO"   # Crude Oil: WTI (daily)

[[series]]
source = "fred"
id = "DCOILBRENTEU" # Crude Oil: Brent (daily)

[[series]]
source = "fred"
id = "DHHNGSP"      # Henry Hub Natural Gas Spot (daily)

[[series]]
source = "fred"
id = "PNRGINDEXM"   # IMF Global Energy Price Index

